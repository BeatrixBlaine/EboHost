spring.application.name=availability-service

# configure server port
server.port=8083

# connect database
spring.datasource.url=jdbc:mysql://localhost:3309/ebohost_availability
spring.datasource.username=ebohost
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=availability-service
info.app.description=availability service responsible for managing room availability
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true


